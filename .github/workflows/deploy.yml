name: 🚀 Build & Deploy 7XVOIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: 📦 Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 1. Build & Push Node.js Backend ──
      - name: 🚀 Build & Push Node Backend (7xvoip:latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}/7xvoip:latest

      # ── 2. Build & Push FreeSWITCH PBX ──
      - name: 🚀 Build & Push FreeSWITCH PBX (7xvoip-freeswitch:latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.freeswitch
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}/7xvoip-freeswitch:latest

  deploy-to-vps:
    name: ⚡ Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🔌 SSH & Execute Live Container Rolling Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "📥 Pulling latest images from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}/7xvoip:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}/7xvoip-freeswitch:latest

            echo "🔄 Updating FreeSWITCH Live PBX Container..."
            docker rm -f freeswitch_live 2>/dev/null || true
            docker run -d \
              --name freeswitch_live \
              --restart unless-stopped \
              --net=host \
              -e ESL_ALLOWED_IP=172.16.0.0/12 \
              -e FREESWITCH_PASSWORD=ClueCon \
              ${{ secrets.DOCKERHUB_USERNAME || 'leoaddre' }}/7xvoip-freeswitch:latest

            echo "🔄 Restarting Node.js App container..."
            docker restart 7xvoip 2>/dev/null || docker restart $(docker ps | grep -i 7xvoip | awk '{print $1}') 2>/dev/null || true

            echo "✅ All services updated and running live!"
