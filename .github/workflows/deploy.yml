name: 🚀 Build & Deploy 7XVOIP PBX System

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and Push Node.js Backend Application
      - name: 📦 Build & Push Node Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip:latest

      # 2. Build and Push FreeSWITCH PBX Container
      - name: 📦 Build & Push FreeSWITCH Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.freeswitch
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip-freeswitch:latest

      # 3. Trigger EasyPanel Webhook to Auto-Deploy on VPS (Optional)
      - name: 🚀 Trigger EasyPanel Auto-Deploy Webhook
        if: env.EASYPANEL_WEBHOOK_URL != ''
        env:
          EASYPANEL_WEBHOOK_URL: ${{ secrets.EASYPANEL_WEBHOOK_URL }}
        run: |
          curl -X POST "$EASYPANEL_WEBHOOK_URL"
