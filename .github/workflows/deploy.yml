name: 🚀 Build & Direct VPS Auto-Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: 📦 Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and Push Node.js Backend Application
      - name: 📦 Build & Push Node Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip:latest

      # 2. Build and Push FreeSWITCH PBX Container
      - name: 📦 Build & Push FreeSWITCH Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.freeswitch
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip-freeswitch:latest

  deploy-to-vps:
    name: 🚀 SSH Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: env.VPS_HOST != ''
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: ⚡ Deploy on VPS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Pulling latest images from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip-freeswitch:latest

            echo "🔄 Updating FreeSWITCH Live container..."
            docker rm -f freeswitch_live 2>/dev/null || true
            docker run -d \
              --name freeswitch_live \
              --restart unless-stopped \
              --net=host \
              -e ESL_ALLOWED_IP=172.16.1.7 \
              -e FREESWITCH_PASSWORD=ClueCon \
              ${{ secrets.DOCKERHUB_USERNAME }}/7xvoip-freeswitch:latest

            echo "🔄 Restarting Node.js App container..."
            docker restart $(docker ps | grep -i 7xvoipbx | awk '{print $1}') 2>/dev/null || true

            echo "✅ Deployment completed successfully!"
